<svg width="890" height="155" viewBox="0 0 890 155" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-title pr-desc">
<title id="pr-title">Shipped</title>
<desc id="pr-desc">Shipped: 2 project cards.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}
.card-title{font-weight:700;letter-spacing:.02em}
.card-desc{fill:#cdc9c1}
.card-shadow{fill:#158f65;transform:translate(4px,4px)}
.card-meta{fill:#8f8a80}
.entrance{opacity:1;transform:translate(0,0) scale(1)}

@media (prefers-reduced-motion: no-preference){
  .entrance{animation:cardIn .72s cubic-bezier(.32,.72,0,1) forwards}
  .e0{animation-delay:.16s}
  .e1{animation-delay:.24s}
  .e2{animation-delay:.32s}
  @keyframes cardIn{
    0%{opacity:0;transform:translate(0,22px) scale(.97)}
    100%{opacity:1;transform:translate(0,0) scale(1)}
  }
}
</style>
<rect width="890" height="155" fill="#0c0c0e"/>
<g class="entrance e0">
<rect class="card-shadow" x="30.0" y="40.0" width="403.0" height="98.0"/>
<rect x="30.0" y="40.0" width="403.0" height="98.0" fill="#141417" stroke="#e4e0d8" stroke-width="2"/>
<text class="card-title" x="48.0" y="69.0" font-size="14" fill="#f0ede6">GITOPS OBSERVABILITY PLATFORM</text>
<text class="card-desc" x="48.0" y="98.0" font-size="13">A Kubernetes GitOps and Observability Platform using</text>
<text class="card-desc" x="48.0" y="116.0" font-size="13">KIND, ArgoCD, Prometheus, Grafana, and Loki</text>
</g>
<g class="entrance e1">
<rect class="card-shadow" x="457.0" y="40.0" width="403.0" height="98.0"/>
<rect x="457.0" y="40.0" width="403.0" height="98.0" fill="#141417" stroke="#e4e0d8" stroke-width="2"/>
<text class="card-title" x="475.0" y="69.0" font-size="14" fill="#f0ede6">BOOK INVENTORY API</text>
<text class="card-desc" x="475.0" y="98.0" font-size="13">No description set on GitHub</text>
</g>
</svg>
