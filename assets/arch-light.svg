<svg width="890" height="182.79" viewBox="0 0 890 182.79" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">The system I work on</title>
<desc id="arch-desc">Request path: client to gateway to services to postgres, with continuous traffic on every link; gateway and services are the two components I own.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}
.node-name{font-weight:700;letter-spacing:.02em;font-size:12.5px}
.node-sub{font-size:10.5px;fill:#6b675f}
.node-owned{fill:#e9e7e0;stroke:#2a2a28;stroke-width:2.145px}
.node-neutral{fill:#f1f0eb;stroke:#d8d5cc;stroke-width:2.145px}
.shadow-owned{fill:#0f6b4a;transform:translate(4.289px,4.289px)}
.shadow-neutral{fill:#d8d5cc;transform:translate(3.217px,3.217px)}
.p0{transform:translateX(0px)}
.p1{transform:translateX(6.75px)}
.p2{transform:translateX(13.49px)}

@media (prefers-reduced-motion: no-preference){
  .p0,.p1,.p2{animation:archFlow 4.2s linear infinite}
  .p0{animation-delay:0s}
  .p1{animation-delay:-0.5s}
  .p2{animation-delay:-1s}
}
@keyframes archFlow{
  0%{transform:translateX(0px)}
  100%{transform:translateX(56.67px)}
}
</style>
<rect width="890" height="182.79" fill="#faf9f6"/>
<g transform="translate(30,0) scale(0.932584)">

