<svg width="890" height="171" viewBox="0 0 890 171" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-title pr-desc">
<title id="pr-title">Working on now</title>
<desc id="pr-desc">Working on now: 1 project card.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}
.card-title{font-weight:700;letter-spacing:.02em}
.card-desc{fill:#3a3a36}
.card-shadow{fill:#0f6b4a;transform:translate(4px,4px)}
.card-meta{fill:#6b675f}
.entrance{opacity:1;transform:translate(0,0) scale(1)}

@media (prefers-reduced-motion: no-preference){
  .entrance{animation:cardIn .72s cubic-bezier(.32,.72,0,1) forwards}
  .e0{animation-delay:.16s}
  .e1{animation-delay:.24s}
  .e2{animation-delay:.32s}
  @keyframes cardIn{
    0%{opacity:0;transform:translate(0,22px) scale(.97)}
    100%{opacity:1;transform:translate(0,0) scale(1)}
  }
}
</style>
<rect width="890" height="171" fill="#faf9f6"/>
<g class="entrance e0">
<rect class="card-shadow" x="30.0" y="40.0" width="830.0" height="114.0"/>
<rect x="30.0" y="40.0" width="830.0" height="114.0" fill="#f1f0eb" stroke="#2a2a28" stroke-width="2"/>
<rect x="48.0" y="60.0" width="10" height="10" fill="#0f6b4a"/>
<text class="card-title" x="68.0" y="69.0" font-size="14" fill="#141412">TENANTGUARD</text>
<text class="card-desc" x="48.0" y="98.0" font-size="13">Proves whether a Go application's SQL respects multi-tenant row isolation, using PostgreSQL RLS as the oracle</text>
<text class="mono card-meta" x="48.0" y="122.0" font-size="11">ACTIVE · Go · pushed 2026-09-04</text>
</g>
</svg>
