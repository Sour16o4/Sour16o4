<svg width="890" height="196" viewBox="0 0 890 196" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">The system I work on</title>
<desc id="arch-desc">Request path: client to gateway to services to postgres, with continuous traffic on every link; gateway and services are the two components I own.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}
.node-name{font-weight:700;letter-spacing:.02em;font-size:12.5px}
.node-sub{font-size:10.5px;fill:#8f8a80}
.node-owned{fill:#181820;stroke:#e4e0d8;stroke-width:2px}
.node-neutral{fill:#141417;stroke:#26262b;stroke-width:2px}
.shadow-owned{fill:#158f65;transform:translate(4px,4px)}
.shadow-neutral{fill:#26262b;transform:translate(3px,3px)}
.p0{transform:translateX(0px)}
.p1{transform:translateX(6.75px)}
.p2{transform:translateX(13.49px)}

@media (prefers-reduced-motion: no-preference){
  .p0,.p1,.p2{animation:archFlow 4.2s linear infinite}
  .p0{animation-delay:0s}
  .p1{animation-delay:-0.5s}
  .p2{animation-delay:-1s}
}
@keyframes archFlow{
  0%{transform:translateX(0px)}
  100%{transform:translateX(56.67px)}
}
</style>
<rect width="890" height="196" fill="#0c0c0e"/>
<line x1="180.0" y1="108.0" x2="229.7" y2="108.0" stroke="#33333b" stroke-width="2"/>
<polygon points="229.7,103.0 236.7,108.0 229.7,113.0" fill="#33333b"/>
<line x1="416.7" y1="108.0" x2="466.3" y2="108.0" stroke="#33333b" stroke-width="2"/>
<polygon points="466.3,103.0 473.3,108.0 466.3,113.0" fill="#33333b"/>
<line x1="653.3" y1="108.0" x2="703.0" y2="108.0" stroke="#33333b" stroke-width="2"/>
<polygon points="703.0,103.0 710.0,108.0 703.0,113.0" fill="#33333b"/>
<rect class="shadow-neutral" x="0.0" y="40.0" width="180" height="88"/>
<rect class="node-neutral" x="0.0" y="40.0" width="180" height="88"/>
<text class="node-name" x="14.0" y="70.0" fill="#8f8a80">CLIENT</text>
<text class="mono node-sub" x="14.0" y="88.0">http · grpc</text>
<rect class="shadow-owned" x="236.7" y="40.0" width="180" height="88"/>
<rect class="node-owned" x="236.7" y="40.0" width="180" height="88"/>
<text class="node-name" x="250.7" y="70.0" fill="#f0ede6">GATEWAY</text>
<text class="mono node-sub" x="250.7" y="88.0">go · routing · auth</text>
<rect class="shadow-owned" x="473.3" y="40.0" width="180" height="88"/>
<rect class="node-owned" x="473.3" y="40.0" width="180" height="88"/>
<text class="node-name" x="487.3" y="70.0" fill="#f0ede6">SERVICES</text>
<text class="mono node-sub" x="487.3" y="88.0">go · queues</text>
<rect class="shadow-neutral" x="710.0" y="40.0" width="180" height="88"/>
<rect class="node-neutral" x="710.0" y="40.0" width="180" height="88"/>
<text class="node-name" x="724.0" y="70.0" fill="#8f8a80">POSTGRES</text>
<text class="mono node-sub" x="724.0" y="88.0">tenant-scoped</text>
<g transform="translate(180.0,0)">
<rect class="p0" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p1" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p2" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
</g>
<g transform="translate(416.7,0)">
<rect class="p0" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p1" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p2" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
</g>
<g transform="translate(653.3,0)">
<rect class="p0" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p1" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
<rect class="p2" x="0" y="104.0" width="8" height="8" fill="none" stroke="#158f65" stroke-width="2"/>
</g>
<text class="mono" x="8.0" y="158.0" font-size="11" fill="#8f8a80">
i own the <tspan fill="#5cd3a8">middle two</tspan> &#183; request path <tspan fill="#5cd3a8">left to right</tspan> &#183; every row scoped by <tspan fill="#5cd3a8">tenant_id</tspan>
</text>
</svg>
