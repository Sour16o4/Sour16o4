<svg width="890" height="200" viewBox="0 0 890 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pr-title pr-desc">
<title id="pr-title">Working on now</title>
<desc id="pr-desc">Working on now: 2 project cards.</desc>
<style>
text{font-family:system-ui, -apple-system, 'Segoe UI', sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', Menlo, Consolas, monospace}
.card-title{font-weight:700;letter-spacing:.02em}
.card-desc{fill:#cdc9c1}
.card-shadow{fill:#158f65;transform:translate(4px,4px)}
.progress-label{fill:#8f8a80}
.entrance{opacity:1;transform:translate(0,0) scale(1)}

@media (prefers-reduced-motion: no-preference){
  .entrance{animation:cardIn .72s cubic-bezier(.32,.72,0,1) both}
  .e0{animation-delay:.16s}
  .e1{animation-delay:.24s}
  .e2{animation-delay:.32s}
  @keyframes cardIn{
    0%{opacity:0;transform:translate(0,22px) scale(.97)}
    100%{opacity:1;transform:translate(0,0) scale(1)}
  }
}
</style>
<rect width="890" height="200" fill="#0c0c0e"/>
<g class="entrance e0">
<rect class="card-shadow" x="0.0" y="40.0" width="433.0" height="143.0"/>
<rect x="0.0" y="40.0" width="433.0" height="143.0" fill="#141417" stroke="#e4e0d8" stroke-width="2"/>
<rect x="18.0" y="60.0" width="10" height="10" fill="#158f65"/>
<text class="card-title" x="38.0" y="69.0" font-size="14" fill="#f0ede6">RELAY</text>
<text class="card-desc" x="18.0" y="98.0" font-size="13">One API in front of every LLM provider — routing, failover,</text>
<text class="card-desc" x="18.0" y="116.0" font-size="13">per-key budgets.</text>
<rect x="18.0" y="138.0" width="397.0" height="11" fill="#141417" stroke="#26262b" stroke-width="2"/>
<rect class="progress-fill-0" x="18.0" y="138.0" width="285.8" height="11" fill="#158f65"/>
<text class="mono progress-label" x="18.0" y="165.0" font-size="10.5">72%</text>
<style>
.progress-fill-0{width:285.8px}
@media (prefers-reduced-motion: no-preference){
  .progress-fill-0{animation:fillIn0 1.05s cubic-bezier(.32,.72,0,1) .16s both}
  @keyframes fillIn0{ 0%{width:0px} 100%{width:285.8px} }
}
</style>
</g>
<g class="entrance e1">
<rect class="card-shadow" x="457.0" y="40.0" width="433.0" height="143.0"/>
<rect x="457.0" y="40.0" width="433.0" height="143.0" fill="#141417" stroke="#e4e0d8" stroke-width="2"/>
<rect x="475.0" y="60.0" width="10" height="10" fill="#158f65"/>
<text class="card-title" x="495.0" y="69.0" font-size="14" fill="#f0ede6">TENANTGUARD</text>
<text class="card-desc" x="475.0" y="98.0" font-size="13">Reads your SQL and fails the build when a query forgets its</text>
<text class="card-desc" x="475.0" y="116.0" font-size="13">tenant filter.</text>
<rect x="475.0" y="138.0" width="397.0" height="11" fill="#141417" stroke="#26262b" stroke-width="2"/>
<rect class="progress-fill-1" x="475.0" y="138.0" width="178.7" height="11" fill="#158f65"/>
<text class="mono progress-label" x="475.0" y="165.0" font-size="10.5">45%</text>
<style>
.progress-fill-1{width:178.7px}
@media (prefers-reduced-motion: no-preference){
  .progress-fill-1{animation:fillIn1 1.05s cubic-bezier(.32,.72,0,1) .16s both}
  @keyframes fillIn1{ 0%{width:0px} 100%{width:178.7px} }
}
</style>
</g>
</svg>
