<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A0F0C"/>
      <stop offset="55%" stop-color="#24100B"/>
      <stop offset="100%" stop-color="#170A08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#FF8C42" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#E84A27" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E84A27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E84A27"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="98" cy="115" r="46"/>
    </clipPath>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="900" height="230" fill="url(#bg)"/>

  <circle cx="98" cy="115" r="118" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="r" values="112;126;112" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="98" cy="115" r="48" fill="none" stroke="url(#ring)" stroke-width="2.5"/>
  <image href="https://avatars.githubusercontent.com/u/102990009?v=4" x="52" y="69" width="92" height="92" clip-path="url(#avatarClip)"/>

  <text x="178" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" fill="#FFF6E8">Sourav Salampuria</text>
  <text x="178" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" letter-spacing="0.3" fill="#FFB35C">Backend Engineer · Go, PostgreSQL &amp; Cloud-Native Systems</text>
  <text x="178" y="153" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#E9CDBC">Building secure, observable backend systems — from row-level security to GitOps pipelines.</text>

  <rect x="178" y="172" width="42" height="3" rx="1.5" fill="url(#rule)"/>
</svg>
