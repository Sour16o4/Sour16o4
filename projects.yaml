# Hand-maintained project + link data. Every project here must correspond
# to a public repo on github.com/Sour16o4 — no placeholders, no aspirational
# entries. Blurbs are the repo's own GitHub description, verbatim, where one
# exists; do not paraphrase them into something more impressive.
#
# `status: active`  -> rendered in "working on now"
# `status: shipped` -> rendered in "shipped"
#
# Only the repos pinned on the GitHub profile appear here.
# sourav-salampuria-portfolio is a real repo too, but it's a personal site,
# not a project card — it's the footer's portfolio link instead.
projects:
  - name: tenantguard
    blurb: "Proves whether a Go application's SQL respects multi-tenant row isolation, using PostgreSQL RLS as the oracle"
    language: Go
    last_push: "2026-09-04"
    status: active
    repo_url: "https://github.com/Sour16o4/tenantguard"

  - name: gitops observability
    blurb: "A Kubernetes GitOps and Observability Platform using KIND, ArgoCD, Prometheus, Grafana, and Loki"
    language: Shell
    last_push: "2026-05-27"
    status: shipped
    repo_url: "https://github.com/Sour16o4/gitops-observability-platform"

  - name: Skillsight
    blurb: "Skillsight — a curated link aggregator for frontend, design, and Claude Code resources with an in-app preview viewer, real site thumbnails, and an admin dashboard."
    language: JavaScript
    last_push: "2026-09-18"
    status: shipped
    repo_url: "https://github.com/Sour16o4/Skillsight"

  - name: Velanthe
    blurb: "Velanthe: a fictional luxury skincare brand with a full shopping flow. It has a filterable catalog, a synced bag and wishlist, guest or account checkout, and 3D product scenes."
    language: JavaScript
    last_push: "2026-09-30"
    status: shipped
    repo_url: "https://github.com/Sour16o4/Velanthe"

